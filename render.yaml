# Render Blueprint. Connect this repo in the Render dashboard and pick this file.
# RENDER=true is set by Render, which switches the Nitro preset to render-com.
services:
  - type: web
    name: kiln
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: HOST
        value: 0.0.0.0
      - key: NITRO_PRESET
        value: render-com
